<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>數學遊戲：位置猜猜猜 v8.7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=400;700&display=swap');
        :root { 
            --bg-image: url('my_background.jpg'); /* 統一背景圖 */
            --cabin-frame-color: #8B4513; 
            --cabin-inner-color: #F5DEB3; 
            --button-color: #5CB85C; 
            --highlight-color: #FFD700; 
            --emphasis-color: #D9534F; 
            --font-family: 'Noto Sans TC', sans-serif; 
            --container-bg: rgba(232, 221, 203, 0.85); 
        }
        
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body { 
            font-family: var(--font-family); 
            background-image: var(--bg-image); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed;
            color: var(--cabin-frame-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            padding: 10px;
        }

        /* 遊戲主容器 */
        .game-container { 
            position: relative; 
            width: 95vw; 
            height: 92vh; 
            max-width: 1200px; 
            max-height: 800px; 
            background: var(--container-bg); 
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px; 
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.25); 
            border: 0.5rem solid var(--cabin-frame-color); 
            display: flex; 
            flex-direction: column; 
            padding: 1.5vmin; 
            overflow: hidden;
        }

        .info-panel { text-align: center; flex-shrink: 0; }
        header { padding-bottom: 0.2rem; }
        h1 { margin: 0; font-size: 3.2vh; }
        
        .status-bar { 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            font-size: 2.3vh; 
            font-weight: bold; 
            padding: 0.5vh; 
            background-color: rgba(255, 255, 255, 0.5); 
            border-radius: 0.8rem; 
            margin-bottom: 0.8vh; 
        }
        
        .difficulty-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(139, 69, 19, 0.1);
            padding: 0.1vh 0.8vh;
            border-radius: 0.5rem;
        }
        
        /* 預設指令區大字體樣式（適用於直向） */
        .instruction-area { 
            font-size: 3.5vh; 
            font-weight: bold; 
            padding: 0.2vh; 
            margin-bottom: 0.5vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 5.5vh;
        }
        .instruction-area .emoji { font-size: 1.3em; vertical-align: middle; margin: 0 0.5rem; }
        
        /* 核心自適應內容區 */
        .content-area { 
            display: flex; 
            flex-grow: 1; 
            gap: 1.5vh; 
            min-height: 0; 
            width: 100%;
        }

        /* ==================================================== */
        /* ★ 橫向佈局極致優化：強制放大指令字體 + 再縮小櫃子 ★ */
        /* ==================================================== */
        @media (orientation: landscape) {
            .game-container {
                width: 80vw;
                height: 85vh;
                padding: 2vh;
            }
            .content-area {
                flex-direction: row;
                align-items: stretch;
            }
            
            /* 極致縮小小屋櫃子在橫向時的寬度，縮短拖曳物理距離 */
            .game-grid {
                width: 58%; /* 再縮小至 58% */
                height: 100%;
            }
            .draggable-object-area {
                width: 42%; /* 擴大拖曳緩衝區 */
                height: 100%;
                flex-direction: column;
            }
            
            h1 { font-size: 2.8vh; }
            .status-bar { font-size: 2vh; padding: 0.4vh; }
            
            /* ★ 強制覆蓋放大：橫向時「A在B左面」字體放大至與直向一樣大 (3.6vh)，Emoji 放大至 1.3em ★ */
            body .instruction-area { 
                font-size: 3.6vh !important; 
                min-height: 5.5vh !important; 
            }
            body .instruction-area .emoji {
                font-size: 1.3em !important;
            }
        }

        /* 預設直向佈局 (iPad 直向) */
        @media (orientation: portrait) {
            .content-area {
                flex-direction: column;
                align-items: stretch;
            }
            .game-grid {
                width: 100%;
                height: 75%;
            }
            .draggable-object-area {
                width: 100%;
                height: 25%;
                flex-direction: row;
            }
        }

        .game-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 1vh; 
            background-color: var(--cabin-frame-color); 
            border: 0.8vh solid var(--cabin-frame-color); 
            border-radius: 1.5rem; 
            padding: 0.8vh; 
        }
        
        .grid-cell { 
            background-color: var(--cabin-inner-color); 
            border-radius: 0.8rem; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 5.5vh; 
            position: relative;
        }
        
        .grid-cell[data-anchor="true"] {
            box-shadow: inset 0 0 0 0.5vh var(--highlight-color);
        }
        
        .draggable-object-area { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0.5vh; 
            flex-shrink: 0; 
        }
        
        #draggable-emoji-container { 
            width: 100%;
            height: 100%;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: 0.3vh dashed var(--cabin-frame-color); 
            border-radius: 1rem; 
            background-color: #FFF8E1; 
        }
        #draggable-emoji-container .emoji { 
            font-size: 7vh; 
            line-height: 1; 
        }
        
        .emoji { cursor: grab; text-shadow: 0.2rem 0.2rem 0.4rem rgba(0,0,0,0.2); }
        .emoji.dragging { opacity: 0.5; cursor: grabbing; }
        .emoji.immobile { cursor: not-allowed; }

        /* 覆蓋介面 */
        .game-overlay, .feedback-overlay, .level-alert-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
        }
        
        .game-overlay { 
            background-image: linear-gradient(rgba(248, 244, 230, 0.9), rgba(248, 244, 230, 0.9)), var(--bg-image);
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100; 
            padding: 2vh 5vw; 
            box-sizing: border-box; 
        }
        
        .feedback-overlay { 
            background-color: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(3px); 
            -webkit-backdrop-filter: blur(3px);
            z-index: 150; 
        }
        
        .level-alert-overlay { 
            z-index: 200; 
            pointer-events: none; 
            background: transparent;
        }
        
        .level-alert-card {
            font-size: 4vh;
            font-weight: bold;
            padding: 1.5vh 3vh;
            border-radius: 1.5rem;
            box-shadow: 0 1rem 2rem rgba(0,0,0,0.3);
            animation: alert-pop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .level-up { background-color: #28a745; color: #ffffff; }
        .level-down { background-color: #d9534f; color: #ffffff; }

        @keyframes alert-pop {
            0% { transform: scale(0.3) translateY(20px); opacity: 0; }
            30% { transform: scale(1.1) translateY(0); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8) translateY(-20px); opacity: 0; }
        }

        .hidden { display: none !important; }
        .feedback-icon { font-size: 20vh; font-weight: bold; text-shadow: 0 0 2rem rgba(0,0,0,0.3); animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .feedback-icon.correct { color: #28a745; }
        .feedback-icon.wrong { color: #dc3545; }

        @keyframes pop-in { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .game-overlay h2 { 
            font-size: 4.2vh; 
            margin: 0.5vh 0; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        
        .game-button { 
            font-size: 2.5vh; 
            padding: 1vh 3vh; 
            background-color: var(--button-color); 
            color: white; 
            border: none; 
            border-radius: 1rem; 
            cursor: pointer; 
            margin-top: 1vh;
            box-shadow: 0 4px 10px rgba(92, 184, 92, 0.4);
        }
        .game-button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* 登入介面專用版面 */
        .login-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 700px;
            height: 90vh;
            justify-content: space-between;
        }

        .login-form-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            padding: 1.5vh 3vw;
            border-radius: 15px;
            border: 2px solid var(--cabin-frame-color);
        }

        .login-fields-row {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            width: 100%;
            margin-bottom: 0.5vh;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 2.4vh;
        }
        .form-group select {
            font-size: 2.2vh;
            padding: 0.5vh 1.5vh;
            border-radius: 0.5rem;
            border: 2px solid var(--cabin-frame-color);
            background: #fff;
        }

        #login-leaderboard-container {
            width: 100%;
            height: 48vh; 
            overflow-y: auto;
            border: 2px solid var(--cabin-inner-color);
            border-radius: 10px;
            background: rgba(255,255,255,0.75);
            margin-top: 1vh;
        }

        #leaderboard-container { 
            width: 100%; 
            max-width: 650px; 
            height: 40vh; 
            overflow-y: auto; 
            border: 2px solid var(--cabin-inner-color); 
            border-radius: 10px; 
            background: rgba(255,255,255,0.75); 
            margin-top: 1vh; 
        }

        .leaderboard { width: 100%; border-collapse: collapse; font-size: 2vh; }
        .leaderboard th, .leaderboard td { padding: 1vh; text-align: center; border-bottom: 1px solid rgba(139,69,19,0.2); }
        .leaderboard th { background-color: var(--cabin-frame-color); color: var(--bg-color); position: sticky; top: 0; }
        .leaderboard tr.current-player { background-color: var(--highlight-color) !important; font-weight: bold; }
        #player-rank { font-size: 2.3vh; font-weight: bold; color: var(--emphasis-color); margin: 0.5vh 0; }

        .designer-credit {
            position: absolute;
            bottom: 0.3rem;
            right: 1.5rem;
            font-size: 1.2rem;
            color: rgba(139, 69, 19, 0.7);
        }
    </style>
</head>
<body>

    <!-- 遊戲主畫面 -->
    <div class="game-container hidden" id="game-main-interface">
        <div class="info-panel">
            <header><h1>森林裡的奇妙小屋</h1></header>
            <div class="status-bar">
                <div id="timer">遊戲時間: 60</div>
                <div class="difficulty-badge" id="difficulty-display">
                    <span id="diff-level">⭐ 初階</span>
                    <span id="diff-streak">(連勝: 0/3)</span>
                </div>
                <div id="score">分數: 0</div>
            </div>
            <div class="instruction-area" id="instruction-text"></div>
        </div>
        <div class="content-area">
            <div class="game-grid" id="game-grid"></div>
            <div class="draggable-object-area"><div id="draggable-emoji-container"></div></div>
        </div>
        <div class="designer-credit">Designed by 陳綺雯老師</div>
    </div>

    <!-- 登入畫面（內嵌即時排行榜） -->
    <div class="game-overlay" id="login-screen">
        <div class="login-layout">
            <h2>位置猜猜猜 🏠</h2>
            <div class="login-form-container">
                <div class="login-fields-row">
                    <div class="form-group">
                        <label for="class-select">班別:</label>
                        <select id="class-select">
                            <option value="">請選擇...</option>
                            <option value="1A">1A</option>
                            <option value="1B">1B</option>
                            <option value="1C">1C</option>
                            <option value="1D">1D</option>
                            <option value="1E">1E</option>
                            <option value="教師">教師</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="student-id-select" id="id-or-name-label">學號:</label>
                        <select id="student-id-select">
                            <option value="">請先選擇班別</option>
                        </select>
                    </div>
                </div>
                <div id="login-error" style="color: var(--emphasis-color); font-size: 1.8vh; text-align: center; height: 2vh;"></div>
                <div style="text-align: center;">
                    <button class="game-button" id="login-button" style="margin-top: 0.5vh;">確定進入</button>
                </div>
            </div>
            
            <div style="width: 100%;">
                <h3 style="margin: 0.5vh 0; font-size: 2.2vh; text-align: left; padding-left: 5px;">🏆 龍虎榜：</h3>
                <div id="login-leaderboard-container"></div>
            </div>
        </div>
    </div>

    <!-- 規則說明畫面 -->
    <div class="game-overlay hidden" id="instruction-screen">
        <h2>遊戲規則 📜</h2>
        <p style="font-size: 2.2vh; line-height: 1.6; max-width: 60rem; margin: 1.5vh 0;">
            在 60 秒內，根據上方指令將水果拖曳至正確位置！<br>
            連續答對 3 題自動晉級，難度越高，單題得分越多！<br>
            Level 3 題目擁有大量空格考驗，請仔細比對雙重方位線索！
        </p>
        <button class="game-button" id="ready-button">準備好了！</button>
    </div>

    <!-- 結算畫面 -->
    <div class="game-overlay hidden" id="end-screen">
        <h2>時間到！ ⏰</h2>
        <p id="end-message" style="font-size: 2.4vh; margin: 0.5vh 0;"></p>
        <p id="player-rank"></p>
        <div id="leaderboard-container"></div>
        <button class="game-button" id="replay-button">再玩一次</button>
    </div>

    <!-- 答題回饋浮層 -->
    <div class="feedback-overlay hidden" id="feedback-overlay">
        <div class="feedback-icon" id="feedback-icon"></div>
    </div>

    <!-- 升降級文字動畫浮層 -->
    <div class="level-alert-overlay hidden" id="level-alert-overlay">
        <div class="level-alert-card" id="level-alert-text"></div>
    </div>

    <script>
    // --- 版本 8.7 (橫向大字小櫃完美修復版) ---
    const IS_DEBUG_MODE = true; 
    const playerRank = document.getElementById('player-rank');
    const feedbackOverlay = document.getElementById('feedback-overlay');
    const feedbackIcon = document.getElementById('feedback-icon');
    const levelAlertOverlay = document.getElementById('level-alert-overlay');
    const levelAlertText = document.getElementById('level-alert-text');
    const gameMainInterface = document.getElementById('game-main-interface');
    const loginScreen = document.getElementById('login-screen');
    const instructionScreen = document.getElementById('instruction-screen');
    const endScreen = document.getElementById('end-screen');
    const classSelect = document.getElementById('class-select');
    const studentIdSelect = document.getElementById('student-id-select');
    const idOrNameLabel = document.getElementById('id-or-name-label');
    const loginButton = document.getElementById('login-button');
    const loginError = document.getElementById('login-error');
    const readyButton = document.getElementById('ready-button');
    const replayButton = document.getElementById('replay-button');
    const timerDisplay = document.getElementById('timer');
    const scoreDisplay = document.getElementById('score');
    const diffLevelDisplay = document.getElementById('diff-level');
    const diffStreakDisplay = document.getElementById('diff-streak');
    const instructionText = document.getElementById('instruction-text');
    const gameGrid = document.getElementById('game-grid');
    const draggableContainer = document.getElementById('draggable-emoji-container');
    const endMessage = document.getElementById('end-message');
    const leaderboardContainer = document.getElementById('leaderboard-container');
    const loginLeaderboardContainer = document.getElementById('login-leaderboard-container');

    const TEACHER_LIST = ["陳麗嫦校長", "陳子殷老師", "陳珮容老師", "楊靖霖老師", "陳懿文主任", "呂常欣老師"];

    const GRID_ROWS = 3, GRID_COLS = 4, TOTAL_TIME = 60; 
    let score = 0, timer = TOTAL_TIME, timerInterval, currentUser = null; 
    let questionCounter = 0;

    let currentLevel = 1; 
    let consecutiveCorrect = 0; 
    let consecutiveWrong = 0;   

    const LEVEL_SCORES = { 1: 10, 2: 15, 3: 20 };
    const LEVEL_NAMES = { 1: '⭐ 初階', 2: '⭐⭐ 進階', 3: '⭐⭐⭐ 挑戰' };

    const TARGET_EMOJIS = ['🍎', '🍊', '🍋', '🍐', '🍏', '🥭', '🥥', '🍅', '🥝', '🍑']; 
    const DISTRACTOR_EMOJIS = ['🍌', '🍓', '🍇', '🍍', '🍉', '🍒', '🍆', '🥕', '🌽', '🥦']; 
    const TEXT_MAP = { above: '上面', below: '下面', left: '左面', right: '右面', between: '之間' };

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let draggedElement = null; 
    let isChecking = false; 
    let initialX = 0, initialY = 0;
    let currentQuestionData = null;

    function initLoginScreenLeaderboard() {
        const leaderboard = getLeaderboard(); 
        let html = '<table class="leaderboard"><thead><tr><th>排名</th><th>班別</th><th>學號 / 姓名</th><th>最高分數</th><th>挑選次數</th></tr></thead><tbody>'; 
        
        if (leaderboard.length === 0) { 
            html += '<tr><td colspan="5">暫無記錄，期待你的挑戰！</td></tr>'; 
        } else { 
            leaderboard.forEach((player, index) => { 
                const rank = index + 1; 
                html += `<tr>
                    <td>${rank}</td>
                    <td>${player.class}</td>
                    <td>${player.id}</td>
                    <td>${player.score}</td>
                    <td>${player.playsCount || 1} 次</td>
                </tr>`; 
            }); 
        } 
        html += '</tbody></table>'; 
        loginLeaderboardContainer.innerHTML = html;
    }

    function handleClassSelectionChange() {
        const selectedClass = classSelect.value;
        studentIdSelect.innerHTML = '<option value="">請選擇...</option>';

        if (!selectedClass) {
            idOrNameLabel.textContent = '學號:';
            studentIdSelect.innerHTML = '<option value="">請先選擇班別</option>';
            return;
        }

        if (selectedClass === '教師') {
            idOrNameLabel.textContent = '姓名:';
            TEACHER_LIST.forEach(teacher => {
                const opt = document.createElement('option');
                opt.value = teacher;
                opt.textContent = teacher;
                studentIdSelect.appendChild(opt);
            });
        } else {
            idOrNameLabel.textContent = '學號:';
            for (let i = 1; i <= 35; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i} 號`;
                studentIdSelect.appendChild(opt);
            }
        }
    }

    function handleLogin() { 
        const className = classSelect.value; 
        const studentId = studentIdSelect.value; 
        if (!className || !studentId) { 
            loginError.textContent = '請完整選擇班別及學號/姓名！'; 
            return; 
        } 
        currentUser = { class: className, id: studentId }; 
        loginError.textContent = ''; 
        playSound('click'); 
        loginScreen.classList.add('hidden'); 
        instructionScreen.classList.remove('hidden'); 
    }

    function startGame() { 
        playSound('click'); 
        instructionScreen.classList.add('hidden'); 
        endScreen.classList.add('hidden'); 
        gameMainInterface.classList.remove('hidden'); 
        score = 0; 
        timer = TOTAL_TIME; 
        questionCounter = 0;  
        currentLevel = 1;
        consecutiveCorrect = 0;
        consecutiveWrong = 0;
        updateStatus(); 
        generateQuestion(); 
        clearInterval(timerInterval); 
        timerInterval = setInterval(() => { 
            timer--; 
            updateStatus(); 
            if (timer <= 5 && timer > 0) playSound('tick'); 
            if (timer <= 0) endGame(); 
        }, 1000); 
    }

    function updateStatus() { 
        timerDisplay.textContent = `遊戲時間: ${timer}`; 
        scoreDisplay.textContent = `分數: ${score}`; 
        diffLevelDisplay.textContent = LEVEL_NAMES[currentLevel];
        diffStreakDisplay.textContent = currentLevel < 3 ? `(連勝: ${consecutiveCorrect}/3)` : `(最高階)`;
    }

    function triggerLevelAlert(isUp, newLevel) {
        levelAlertText.textContent = isUp ? `等級提升！${LEVEL_NAMES[newLevel]}` : `難度調整至 ${LEVEL_NAMES[newLevel]}`;
        levelAlertText.className = `level-alert-card ${isUp ? 'level-up' : 'level-down'}`;
        levelAlertOverlay.classList.remove('hidden');
        setTimeout(() => {
            levelAlertOverlay.classList.add('hidden');
        }, 1200);
    }

    function generateQuestion() { 
        gameGrid.innerHTML = ''; 
        draggableContainer.innerHTML = ''; 
        currentQuestionData = null;

        if (IS_DEBUG_MODE) { 
            console.log(`第 ${questionCounter + 1} 題 | 等級: Level ${currentLevel}`); 
        } 

        try { 
            if (currentLevel === 1) {
                generateLevel1Question();
            } else if (currentLevel === 2) {
                if (questionCounter > 0 && (questionCounter + 1) % 4 === 0) {
                    generateBetweenQuestion();
                } else {
                    generateLevel2Question();
                }
            } else {
                generateLevel3Question();
            }
        } catch (error) { 
            console.error("生成題目發生錯誤，使用備援題:", error); 
            generateLevel1Question(); 
        } 
    }

    function generateLevel1Question() {
        const types = ['above', 'below', 'left', 'right'];
        const qType = types[Math.floor(Math.random() * types.length)];
        let [subjectEmoji, anchorEmoji] = getRandomItems(TARGET_EMOJIS, 2);
        
        let anchorRow, anchorCol, possibleSolutions = [];
        while (possibleSolutions.length === 0) {
            do {
                anchorRow = Math.floor(Math.random() * GRID_ROWS);
                anchorCol = Math.floor(Math.random() * GRID_COLS);
            } while (!isValidAnchorPosition(anchorRow, anchorCol, qType));
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (checkAnswerLogic(r, c, anchorRow, anchorCol, qType)) {
                        possibleSolutions.push({ r, c });
                    }
                }
            }
        }
        
        const anchorIndex = anchorRow * GRID_COLS + anchorCol;
        const targetSol = possibleSolutions[Math.floor(Math.random() * possibleSolutions.length)];
        const solutionIndex = targetSol.r * GRID_COLS + targetSol.c;

        const gridState = Array(GRID_ROWS * GRID_COLS).fill(null);
        gridState[anchorIndex] = anchorEmoji;

        let availableSpots = [];
        for (let i = 0; i < GRID_ROWS * GRID_COLS; i++) {
            if (i !== anchorIndex && i !== solutionIndex) availableSpots.push(i);
        }
        shuffleArray(availableSpots);
        const distCount = Math.floor(Math.random() * 2) + 1;
        const distractors = getRandomItems(DISTRACTOR_EMOJIS, distCount);
        for (let i = 0; i < distCount; i++) {
            gridState[availableSpots.pop()] = distractors[i];
        }

        renderGrid(gridState, [anchorIndex]);
        instructionText.innerHTML = `<span class="emoji">${subjectEmoji}</span> 在 <span class="emoji">${anchorEmoji}</span> 的${TEXT_MAP[qType]}`;
        currentQuestionData = { level: 1, type: qType, subject: subjectEmoji };
        draggableContainer.appendChild(createDraggableEmoji(subjectEmoji, qType));
    }

    function generateLevel2Question() {
        const types = ['above', 'below', 'left', 'right'];
        const qType = types[Math.floor(Math.random() * types.length)];
        const isSVO = Math.random() < 0.5;
        let [subjectEmoji, anchorEmoji] = getRandomItems(TARGET_EMOJIS, 2);
        
        let anchorRow, anchorCol, possibleSolutions = [];
        while (possibleSolutions.length === 0) {
            do {
                anchorRow = Math.floor(Math.random() * GRID_ROWS);
                anchorCol = Math.floor(Math.random() * GRID_COLS);
            } while (!isValidAnchorPosition(anchorRow, anchorCol, qType));
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (checkAnswerLogic(r, c, anchorRow, anchorCol, qType)) {
                        possibleSolutions.push({ r, c });
                    }
                }
            }
        }
        
        const anchorIndex = anchorRow * GRID_COLS + anchorCol;
        const targetSol = possibleSolutions[Math.floor(Math.random() * possibleSolutions.length)];
        const solutionIndex = targetSol.r * GRID_COLS + targetSol.c;

        const gridState = Array(GRID_ROWS * GRID_COLS).fill(null);
        gridState[anchorIndex] = anchorEmoji;

        let availableSpots = [];
        for (let i = 0; i < GRID_ROWS * GRID_COLS; i++) {
            if (i !== anchorIndex && i !== solutionIndex) availableSpots.push(i);
        }
        shuffleArray(availableSpots);
        const distCount = Math.floor(Math.random() * 2) + 3;
        const distractors = getRandomItems(DISTRACTOR_EMOJIS, distCount);
        for (let i = 0; i < distCount; i++) {
            gridState[availableSpots.pop()] = distractors[i];
        }

        renderGrid(gridState, [anchorIndex]);
        if (isSVO) {
            instructionText.innerHTML = `<span class="emoji">${subjectEmoji}</span> 在 <span class="emoji">${anchorEmoji}</span> 的${TEXT_MAP[qType]}`;
        } else {
            instructionText.innerHTML = `<span class="emoji">${anchorEmoji}</span> 的${TEXT_MAP[qType]}是 <span class="emoji">${subjectEmoji}</span>`;
        }
        
        currentQuestionData = { level: 2, type: qType, subject: subjectEmoji };
        draggableContainer.appendChild(createDraggableEmoji(subjectEmoji, qType));
    }

    function generateLevel3Question() {
        let [subjectEmoji, anchor1Emoji, anchor2Emoji] = getRandomItems(TARGET_EMOJIS, 3);
        
        const solRow = Math.floor(Math.random() * GRID_ROWS);
        const solCol = Math.floor(Math.random() * GRID_COLS);
        const solutionIndex = solRow * GRID_COLS + solCol;

        let hType, anchor1Col;
        if (solCol === 0) {
            hType = 'left'; 
            anchor1Col = Math.floor(Math.random() * (GRID_COLS - 1)) + 1;
        } else if (solCol === GRID_COLS - 1) {
            hType = 'right'; 
            anchor1Col = Math.floor(Math.random() * (GRID_COLS - 1));
        } else {
            hType = Math.random() < 0.5 ? 'left' : 'right';
            if (hType === 'left') {
                const possible = [];
                for (let c = solCol + 1; c < GRID_COLS; c++) possible.push(c);
                anchor1Col = possible[Math.floor(Math.random() * possible.length)];
            } else {
                const possible = [];
                for (let c = 0; c < solCol; c++) possible.push(c);
                anchor1Col = possible[Math.floor(Math.random() * possible.length)];
            }
        }
        const anchor1Index = solRow * GRID_COLS + anchor1Col;

        let vType, anchor2Row;
        if (solRow === 0) {
            vType = 'above'; 
            anchor2Row = Math.floor(Math.random() * (GRID_ROWS - 1)) + 1;
        } else if (solRow === GRID_ROWS - 1) {
            vType = 'below'; 
            anchor2Row = Math.floor(Math.random() * (GRID_ROWS - 1));
        } else {
            vType = Math.random() < 0.5 ? 'above' : 'below';
            if (vType === 'above') {
                const possible = [];
                for (let r = solRow + 1; r < GRID_ROWS; r++) possible.push(r);
                anchor2Row = possible[Math.floor(Math.random() * possible.length)];
            } else {
                const possible = [];
                for (let r = 0; r < solRow; r++) possible.push(r);
                anchor2Row = possible[Math.floor(Math.random() * possible.length)];
            }
        }
        const anchor2Index = anchor2Row * GRID_COLS + solCol;

        const gridState = Array(GRID_ROWS * GRID_COLS).fill(null);
        gridState[anchor1Index] = anchor1Emoji;
        gridState[anchor2Index] = anchor2Emoji;

        let availableSpots = [];
        for (let i = 0; i < GRID_ROWS * GRID_COLS; i++) {
            if (i !== anchor1Index && i !== anchor2Index && i !== solutionIndex) availableSpots.push(i);
        }
        shuffleArray(availableSpots);
        const distCount = Math.random() < 0.5 ? 0 : 1; 
        const distractors = getRandomItems(DISTRACTOR_EMOJIS, distCount);
        for (let i = 0; i < distCount; i++) {
            gridState[availableSpots.pop()] = distractors[i];
        }

        renderGrid(gridState, [anchor1Index, anchor2Index]);
        instructionText.innerHTML = `<span class="emoji">${subjectEmoji}</span> 在 <span class="emoji">${anchor1Emoji}</span> 的${TEXT_MAP[hType]}，<span style="color:var(--emphasis-color)">且</span>在 <span class="emoji">${anchor2Emoji}</span> 的${TEXT_MAP[vType]}`;

        currentQuestionData = { 
            level: 3, 
            type: 'dual_condition', 
            solRow, 
            solCol, 
            subject: subjectEmoji 
        };
        draggableContainer.appendChild(createDraggableEmoji(subjectEmoji, 'dual_condition'));
    }

    function generateBetweenQuestion() { 
        let [subjectEmoji, anchorEmoji1, anchorEmoji2] = getRandomItems(TARGET_EMOJIS, 3); 
        const possibleTriplets = []; 
        for (let r = 0; r < GRID_ROWS; r++) { 
            for (let c = 0; c <= GRID_COLS - 3; c++) { 
                possibleTriplets.push([{r,c}, {r,c:c+1}, {r,c:c+2}]); 
            } 
        } 
        for (let c = 0; c < GRID_COLS; c++) { 
            for (let r = 0; r <= GRID_ROWS - 3; r++) { 
                possibleTriplets.push([{r,c}, {r:r+1,c}, {r:r+2,c}]); 
            } 
        } 
        const triplet = possibleTriplets[Math.floor(Math.random() * possibleTriplets.length)]; 
        const [pos1, solutionPos, pos2] = triplet; 
        const [anchor1Pos, anchor2Pos] = Math.random() < 0.5 ? [pos1, pos2] : [pos2, pos1]; 
        const anchor1Index = anchor1Pos.r * GRID_COLS + anchor1Pos.c; 
        const anchor2Index = anchor2Pos.r * GRID_COLS + anchor2Pos.c; 
        const solutionIndex = solutionPos.r * GRID_COLS + solutionPos.c; 

        let availableSpots = []; 
        for (let i = 0; i < GRID_ROWS * GRID_COLS; i++) { 
            if (i !== anchor1Index && i !== anchor2Index && i !== solutionIndex) availableSpots.push(i); 
        } 
        shuffleArray(availableSpots); 
        const gridState = Array(GRID_ROWS * GRID_COLS).fill(null); 
        gridState[anchor1Index] = anchorEmoji1; 
        gridState[anchor2Index] = anchorEmoji2; 
        
        const distCount = Math.floor(Math.random() * 2) + 2; 
        const distractors = getRandomItems(DISTRACTOR_EMOJIS, distCount); 
        for (let i = 0; i < distCount; i++) { 
            const spot = availableSpots.pop(); 
            if (spot !== undefined) gridState[spot] = distractors[i]; 
        } 
        renderGrid(gridState, [anchor1Index, anchor2Index]); 
        instructionText.innerHTML = `<span class="emoji">${subjectEmoji}</span> 在 <span class="emoji">${anchorEmoji1}</span> 和 <span class="emoji">${anchorEmoji2}</span> 之間`; 
        
        currentQuestionData = { level: 2, type: 'between', subject: subjectEmoji };
        draggableContainer.appendChild(createDraggableEmoji(subjectEmoji, 'between')); 
    }

    function handleDrop(target) { 
        if (isChecking) return; 
        const cell = target ? target.closest('.grid-cell') : null; 
        const isAnswerCorrect = cell && !cell.hasChildNodes() && checkAnswer(cell); 
        
        if (isAnswerCorrect) { 
            playSound('correct'); 
            score += LEVEL_SCORES[currentLevel]; 
            questionCounter++; 
            consecutiveWrong = 0;
            consecutiveCorrect++;

            if (consecutiveCorrect >= 3 && currentLevel < 3) {
                currentLevel++;
                consecutiveCorrect = 0;
                triggerLevelAlert(true, currentLevel);
            }

            updateStatus(); 
            const tempEmoji = draggedElement.cloneNode(true); 
            tempEmoji.classList.remove('dragging'); 
            cell.appendChild(tempEmoji); 
            if (draggedElement.parentElement) { 
                draggedElement.parentElement.removeChild(draggedElement); 
            } 
            showFeedback(true); 
        } else { 
            if (draggedElement) { 
                playSound('wrong'); 
                consecutiveCorrect = 0;
                consecutiveWrong++;

                if (currentLevel === 3) {
                    currentLevel = 2;
                    consecutiveWrong = 0;
                    triggerLevelAlert(false, currentLevel);
                } else if (currentLevel === 2 && consecutiveWrong >= 2) {
                    currentLevel = 1;
                    consecutiveWrong = 0;
                    triggerLevelAlert(false, currentLevel);
                }

                updateStatus();
                showFeedback(false); 
            } 
        } 
    }

    function checkAnswer(droppedCell) { 
        if (!draggedElement) return false; 
        const droppedRow = parseInt(droppedCell.dataset.row); 
        const droppedCol = parseInt(droppedCell.dataset.col); 
        
        if (currentQuestionData && currentQuestionData.type === 'dual_condition') {
            return droppedRow === currentQuestionData.solRow && droppedCol === currentQuestionData.solCol;
        }

        const questionType = draggedElement.dataset.questionType; 
        const anchorCells = gameGrid.querySelectorAll('.grid-cell[data-anchor="true"]'); 
        if (anchorCells.length === 0) return false; 

        if (questionType === 'between') { 
            if (anchorCells.length < 2) return false; 
            const r1 = parseInt(anchorCells[0].dataset.row), c1 = parseInt(anchorCells[0].dataset.col); 
            const r2 = parseInt(anchorCells[1].dataset.row), c2 = parseInt(anchorCells[1].dataset.col); 
            if (c1 === c2) { 
                return droppedCol === c1 && droppedRow > Math.min(r1, r2) && droppedRow < Math.max(r1, r2); 
            } else if (r1 === r2) { 
                return droppedRow === r1 && droppedCol > Math.min(c1, c2) && droppedCol < Math.max(c1, c2); 
            } 
        } else { 
            const anchorRow = parseInt(anchorCells[0].dataset.row); 
            const anchorCol = parseInt(anchorCells[0].dataset.col); 
            return checkAnswerLogic(droppedRow, droppedCol, anchorRow, anchorCol, questionType); 
        } 
        return false; 
    }

    function checkAnswerLogic(droppedRow, droppedCol, anchorRow, anchorCol, questionType) { 
        switch (questionType) { 
            case 'above': return droppedCol === anchorCol && droppedRow < anchorRow; 
            case 'below': return droppedCol === anchorCol && droppedRow > anchorRow; 
            case 'left': return droppedRow === anchorRow && droppedCol < anchorCol; 
            case 'right': return droppedRow === anchorRow && droppedCol > anchorCol; 
            default: return false; 
        } 
    }

    function renderGrid(gridState, anchorIndices) { 
        gameGrid.innerHTML = ''; 
        for (let i = 0; i < gridState.length; i++) { 
            const cell = document.createElement('div'); 
            cell.classList.add('grid-cell'); 
            cell.dataset.row = Math.floor(i / GRID_COLS); 
            cell.dataset.col = i % GRID_COLS; 
            if (gridState[i]) { 
                const emojiSpan = document.createElement('span'); 
                emojiSpan.classList.add('emoji', 'immobile'); 
                emojiSpan.textContent = gridState[i]; 
                if (anchorIndices.includes(i)) cell.dataset.anchor = "true"; 
                cell.appendChild(emojiSpan); 
            } 
            gameGrid.appendChild(cell); 
        } 
    }

    function showFeedback(isCorrect) { 
        feedbackIcon.textContent = isCorrect ? '✓' : '✗'; 
        feedbackIcon.className = 'feedback-icon ' + (isCorrect ? 'correct' : 'wrong'); 
        feedbackOverlay.classList.remove('hidden'); 
        isChecking = true; 
        setTimeout(() => { 
            feedbackOverlay.classList.add('hidden'); 
            if (isCorrect) generateQuestion(); 
            isChecking = false; 
        }, 700); 
    }

    function playSound(type) { 
        if (!audioContext) return; 
        if (audioContext.state === 'suspended') audioContext.resume(); 
        const o = audioContext.createOscillator(), g = audioContext.createGain(); 
        o.connect(g); 
        g.connect(audioContext.destination); 
        switch (type) { 
            case 'click': 
                o.type = 'sine'; o.frequency.setValueAtTime(440, audioContext.currentTime); 
                g.gain.setValueAtTime(0.5, audioContext.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2); 
                break; 
            case 'correct': 
                o.type = 'triangle'; o.frequency.setValueAtTime(523.25, audioContext.currentTime); 
                o.frequency.linearRampToValueAtTime(1046.50, audioContext.currentTime + 0.15); 
                g.gain.setValueAtTime(0.3, audioContext.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2); 
                break; 
            case 'wrong': 
                o.type = 'square'; o.frequency.setValueAtTime(220, audioContext.currentTime); 
                g.gain.setValueAtTime(0.3, audioContext.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3); 
                break; 
            case 'tick': 
                o.type = 'sine'; o.frequency.setValueAtTime(880, audioContext.currentTime); 
                g.gain.setValueAtTime(0.2, audioContext.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1); 
                break; 
            case 'gameOver': 
                o.type = 'sawtooth'; o.frequency.setValueAtTime(440, audioContext.currentTime); 
                o.frequency.linearRampToValueAtTime(220, audioContext.currentTime + 0.5); 
                g.gain.setValueAtTime(0.4, audioContext.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5); 
                break; 
        } 
        o.start(); 
        o.stop(audioContext.currentTime + 0.5); 
    }

    function endGame() { 
        clearInterval(timerInterval); 
        playSound('gameOver'); 
        gameMainInterface.classList.add('hidden'); 
        endMessage.innerHTML = `你在 ${TOTAL_TIME} 秒內累計得分：<strong>${score} 分</strong>！<br>答對題數：${questionCounter} 題`; 
        saveScore(currentUser.class, currentUser.id, score); 
        displayLeaderboard(); 
        endScreen.classList.remove('hidden'); 
    }

    function saveScore(className, studentId, score) { 
        const leaderboard = getLeaderboard(); 
        const playerIndex = leaderboard.findIndex(p => p.class === className && p.id === studentId); 
        
        if (playerIndex > -1) { 
            leaderboard[playerIndex].playsCount = (leaderboard[playerIndex].playsCount || 1) + 1;
            if (score > leaderboard[playerIndex].score) { 
                leaderboard[playerIndex].score = score; 
            } 
        } else { 
            leaderboard.push({ 
                class: className, 
                id: studentId, 
                score: score,
                playsCount: 1 
            }); 
        } 
        localStorage.setItem('mathGameLeaderboard', JSON.stringify(leaderboard)); 
    }

    function getLeaderboard() { 
        const data = localStorage.getItem('mathGameLeaderboard'); 
        return (data ? JSON.parse(data) : []).sort((a, b) => b.score - a.score); 
    }

    function displayLeaderboard() { 
        const leaderboard = getLeaderboard(); 
        
        let html = '<table class="leaderboard"><thead><tr><th>排名</th><th>班別</th><th>學號 / 姓名</th><th>最高分數</th><th>挑選次數</th></tr></thead><tbody>'; 
        let currentPlayerRank = -1; 
        
        if (leaderboard.length === 0) { 
            html += '<tr><td colspan="5">暫無記錄</td></tr>'; 
        } else { 
            leaderboard.forEach((player, index) => { 
                const rank = index + 1; 
                const isCurrentUser = currentUser && player.class === currentUser.class && player.id === currentUser.id; 
                if (isCurrentUser) currentPlayerRank = rank; 
                html += `<tr class="${isCurrentUser ? 'current-player' : ''}">
                    <td>${rank}</td>
                    <td>${player.class}</td>
                    <td>${player.id}</td>
                    <td>${player.score}</td>
                    <td>${player.playsCount || 1} 次</td>
                </tr>`; 
            }); 
        } 
        html += '</tbody></table>'; 
        leaderboardContainer.innerHTML = html; 
        
        if (currentPlayerRank > 0) { 
            playerRank.textContent = `你現時排行第 ${currentPlayerRank} 位`; 
        } else { 
            playerRank.textContent = ''; 
        } 

        initLoginScreenLeaderboard();
    }

    function replayGame() { 
        playSound('click'); 
        endScreen.classList.add('hidden'); 
        initLoginScreenLeaderboard();
        loginScreen.classList.remove('hidden'); 
    }

    function handleDragStart(e) { 
        if (isChecking) { e.preventDefault(); return; } 
        draggedElement = e.target; 
        setTimeout(() => { if (draggedElement) draggedElement.style.visibility = 'hidden'; }, 0); 
    }

    function handleDragEnd() { 
        if (draggedElement) draggedElement.style.visibility = 'visible'; 
        draggedElement = null; 
    }

    function handleTouchStart(e) { 
        if (isChecking) { e.preventDefault(); return; } 
        e.preventDefault(); 
        draggedElement = e.target; 
        const touch = e.touches[0]; 
        initialX = touch.clientX; 
        initialY = touch.clientY; 
        draggedElement.classList.add('dragging'); 
        document.addEventListener('touchmove', handleTouchMove, { passive: false }); 
        document.addEventListener('touchend', handleTouchEnd); 
    }

    function handleTouchMove(e) { 
        e.preventDefault(); 
        if (!draggedElement) return; 
        const touch = e.touches[0]; 
        const dx = touch.clientX - initialX; 
        const dy = touch.clientY - initialY; 
        draggedElement.style.transform = `translate(${dx}px, ${dy}px)`; 
    }

    function handleTouchEnd(e) { 
        if (!draggedElement) return; 
        draggedElement.style.visibility = 'hidden'; 
        const dropTarget = document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY); 
        handleDrop(dropTarget); 
        draggedElement.style.transform = ''; 
        draggedElement.style.visibility = 'visible'; 
        draggedElement.classList.remove('dragging'); 
        document.removeEventListener('touchmove', handleTouchMove); 
        document.removeEventListener('touchend', handleTouchEnd); 
        draggedElement = null; 
    }

    function createDraggableEmoji(emoji, qType) { 
        const element = document.createElement('span'); 
        element.textContent = emoji; 
        element.classList.add('emoji'); 
        element.draggable = true; 
        element.dataset.questionType = qType; 
        element.addEventListener('dragstart', handleDragStart); 
        element.addEventListener('touchstart', handleTouchStart, { passive: false }); 
        return element; 
    }

    function getRandomItems(arr, n) { 
        const shuffled = [...arr].sort(() => 0.5 - Math.random()); 
        return shuffled.slice(0, n); 
    }

    function shuffleArray(array) { 
        for (let i = array.length - 1; i > 0; i--) { 
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]]; 
        } 
    }

    function isValidAnchorPosition(row, col, type) { 
        switch (type) { 
            case 'above': return row > 0; 
            case 'below': return row < GRID_ROWS - 1; 
            case 'left': return col > 0; 
            case 'right': return col < GRID_COLS - 1; 
            default: return true; 
        } 
    }

    document.addEventListener('DOMContentLoaded', () => {
        handleClassSelectionChange();
        initLoginScreenLeaderboard();
    });
    classSelect.addEventListener('change', handleClassSelectionChange);
    gameGrid.addEventListener('dragover', e => e.preventDefault());
    gameGrid.addEventListener('drop', e => { 
        e.preventDefault(); 
        handleDrop(e.target); 
        handleDragEnd(); 
    });
    loginButton.addEventListener('click', handleLogin);
    readyButton.addEventListener('click', startGame);
    replayButton.addEventListener('click', replayGame);
    </script>
